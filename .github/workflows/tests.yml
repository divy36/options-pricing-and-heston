name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[comparison,surface,validation]'
      - run: python -m pytest -q
      - run: python scripts/validate.py
      - run: python scripts/validate_heston.py
      - run: python scripts/compare_models.py --output results/ci-comparison
